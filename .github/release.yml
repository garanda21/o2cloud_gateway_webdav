changelog:
  exclude:
    labels:
      - ignore-for-release

  categories:
    - title: "🚀 New features"
      labels:
        - enhancement

    - title: "🐛 Bug fixes"
      labels:
        - bug

    - title: "📚 Documentation"
      labels:
        - documentation

    - title: "🧰 Other changes"
      labels:
        - "*"
